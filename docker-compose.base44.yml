services:
  app:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3005"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx concurrently --names server,vite --prefix-colors blue,green \"node server.js\" \"npx vite --port=3005 --host=0.0.0.0\""]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
